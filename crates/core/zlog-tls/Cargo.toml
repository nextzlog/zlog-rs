[package]
name = "zlog-tls"
description = "Line-oriented TCP links with optional TLS 1.3, numeric-comparison pairing, tokens, LAN guards, audit and LAN discovery."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mdns-sd = { version = "0.21", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
