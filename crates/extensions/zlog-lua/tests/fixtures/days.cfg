#Days Contest
mycall        JA1ZLO
power         ------HMMPPPP
xpt50         01010101
xpt144        01010101
xpt430        01010101
xpt120        02020202
xpt240        04040404
xpt560        08080808
xpt10G        16161616
dat           days
cut           0
serial        band
serialstart   001
sendnr        $S
mode          on
unlistedmulti off
exit ;
script lua
local scores = {["50"] = 1, ["144"] = 1, ["430"] = 1, ["1200"] = 2, ["2400"] = 4, ["5600"] = 8, ["10.1G"] = 16}
local modes = {CW = true, SSB = true, FM = true, AM = true, RTTY = true, FT4 = true}

function init()
	return {days = {}, count = 0}
end

local function judge(qso)
	if qso.dupe then
		return {invalid = "dupe"}
	end
	if not scores[qso.band] then
		return {invalid = "band"}
	end
	if not modes[qso.mode] then
		return {invalid = "mode"}
	end
	if #string.match(qso.call, "^[%w_]*") < 3 then
		return {invalid = "call"}
	end
	if not string.match(qso.rcvd, "^%d%d%d+$") then
		return {invalid = "rcvd"}
	end
	local base = string.match(qso.call, "^[^/]*")
	return {score = scores[qso.band], mul1 = string.match(base, utf8.charpattern .. "$") or ""}
end

function add(state, qso)
	local day = string.sub(qso.time, 1, 10)
	if not state.days[day] then
		state.days[day] = true
		state.count += 1
	end
	return state, judge(qso)
end

function total(state, sums)
	return sums.score * sums.mults * state.count
end
