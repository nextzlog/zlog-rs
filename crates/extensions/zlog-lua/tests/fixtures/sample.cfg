#Sample Contest
mycall        JA1ZLO
power         --H-H-HMM----
pt7           3111
pt21          3111
pt50          3111
pt144         3111
pt430         3111
dat           sample
cut           0
sendnr        $V
mode          on
counthigh     on
unlistedmulti off
usemulti2     on
exit ;
script lua 1
local bands = {["7"] = true, ["21"] = true, ["50"] = true, ["144"] = true, ["430"] = true}
local modes = {CW = true, SSB = true, FM = true, AM = true}

function init()
	return {tagged = {}, count = 0}
end

local function judge(qso)
	if qso.dupe then
		return {invalid = "dupe"}
	end
	if not bands[qso.band] then
		return {invalid = "band"}
	end
	if not modes[qso.mode] then
		return {invalid = "mode"}
	end
	local digits, tail = string.match(qso.rcvd, "^(%d*)(.*)$")
	if #digits < 2 or (tail ~= "T" and tail ~= "C") then
		return {invalid = "rcvd"}
	end
	return {
		score = if qso.mode == "CW" then 3 else 1,
		mul1 = digits,
		mul2 = if tail == "T" then "T" else "",
	}
end

function add(state, qso)
	local verdict = judge(qso)
	if qso.counted and verdict.mul2 == "T" and not state.tagged[qso.call] then
		state.tagged[qso.call] = true
		state.count += 1
	end
	return state, verdict
end

function total(state, sums)
	return sums.score * (sums.mults + state.count)
end
