[package]
name = "zlog-keyer"
description = "CW keying: WinKeyer and serial-line keyers, F1-F12 messages with $-macros, CQ repeat and a CW keyboard."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
egui = "0.37"
chrono = "0.4"
serialport = { version = "4", default-features = false }
zlog-core = { path = "../zlog-core" }
zlog-ui = { path = "../zlog-ui" }
