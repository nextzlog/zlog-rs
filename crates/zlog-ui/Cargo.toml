[package]
name = "zlog-ui"
description = "What an extension may add to the zLog window: panels drawn with egui."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zlog-core = { path = "../zlog-core" }
chrono = "0.4"
egui = "0.37"
rfd = "0.17"

[features]
# File dialogs answer what `dialog::set_test_pick` says instead of opening, for
# tests that click through the windows (turned on by their dev-dependency).
test-hooks = []

[dev-dependencies]
ttf-parser = "0.25"
